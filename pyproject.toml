[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wenu3d"
version = "0.1.0"
description = "Small PyVista toolkit for geometrically correct astronomical teaching diagrams"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "pyvista>=0.48",
    "vtk>=9.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/fselman/wenu3d"
Documentation = "https://github.com/fselman/wenu3d/tree/feature/interactive-grid-controls/docs"

[tool.setuptools.packages.find]
where = ["src"]
