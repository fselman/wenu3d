[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wenu3d"
version = "0.1.0"
description = "Small PyVista toolkit for geometrically correct astronomical teaching diagrams"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyvista>=0.48",
    "vtk>=9.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
